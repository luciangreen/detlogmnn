name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests (the hybrid, files, the build, the file bridge, and the 200 inputs and outputs)
        run: npm test
      - name: The built site in dist/ is up to date
        run: git diff --exit-code -- dist || (echo "Run node scripts/build.mjs and commit dist/"; exit 1)
